name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: zela-ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6.0.0
        with:
          go-version-file: .go-version
      - uses: actions/setup-node@v5.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Prepare integration dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y haproxy
          echo '127.0.0.1 worker.test' | sudo tee -a /etc/hosts
          docker pull alpine:3.23
          make build
      - run: go mod verify
      - run: make check
      - name: Tests including PostgreSQL, Docker, and manager HA
        env:
          ZELA_TEST_DATABASE_URL: postgres://postgres:zela-ci@127.0.0.1:5432/postgres?sslmode=disable
          ZELA_TEST_DOCKER_SOCKET: /var/run/docker.sock
          ZELA_TEST_DOCKER_IMAGE: alpine:3.23
          ZELA_TEST_MANAGER_BINARY: ${{ github.workspace }}/bin/zela-server
          ZELA_TEST_HAPROXY_BINARY: /usr/sbin/haproxy
          ZELA_TEST_HAPROXY_CONFIG: ${{ github.workspace }}/deploy/haproxy-ha.cfg
        run: make test
      - name: Verify reproducible Linux release archives
        run: |
          python3 scripts/release.py --version v0.0.0-ci --output "$RUNNER_TEMP/release-a"
          python3 scripts/release.py --version v0.0.0-ci --output "$RUNNER_TEMP/release-b"
          diff -r "$RUNNER_TEMP/release-a" "$RUNNER_TEMP/release-b"

  installer:
    name: Installer smoke test (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6.0.0
        with:
          go-version-file: .go-version
      - name: Validate installer
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck scripts/install.sh
          python3 scripts/test_installer.py
      - name: Build and install on real systemd host
        run: |
          python3 scripts/release.py --version v0.0.0-ci --output "$RUNNER_TEMP/installer-release"
          tar -xzf "$RUNNER_TEMP/installer-release/zela-v0.0.0-ci-linux-amd64.tar.gz" -C "$RUNNER_TEMP"
          bundle="$RUNNER_TEMP/zela-v0.0.0-ci-linux-amd64"
          sudo bash "$bundle/install.sh" --bundle-dir "$bundle"
          sudo sha256sum /var/lib/zela/admin-token /var/lib/zela/vault-key > "$RUNNER_TEMP/credentials-before"
          sudo runuser -u zela -- psql -h /var/run/postgresql -p 5433 -d zela -v ON_ERROR_STOP=1 -c "CREATE TABLE public.install_probe (value text); INSERT INTO public.install_probe VALUES ('retained');"
          sudo bash "$bundle/install.sh" --bundle-dir "$bundle"
          sudo sha256sum --check "$RUNNER_TEMP/credentials-before"
          test "$(sudo runuser -u zela -- psql -At -h /var/run/postgresql -p 5433 -d zela -c 'SELECT value FROM public.install_probe')" = retained
          test "$(sudo runuser -u postgres -- psql -At -h /var/run/postgresql -p 5433 -c 'SHOW listen_addresses')" = ''
          systemctl is-enabled zela-server
          systemctl is-active zela-server
          curl -fsS http://127.0.0.1:8080/api/ready
      - name: Service logs on failure
        if: failure()
        run: sudo journalctl -u zela-server --no-pager -n 100
