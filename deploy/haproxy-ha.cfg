# Compose example: private HTTP backends and a loopback-only published port.
# Use TLS and redundant ingress for production; see deploy/HA.md.
global
    maxconn 1024

defaults
    mode http
    timeout connect 3s
    timeout http-request 10s
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h
    retries 0

# Refresh service addresses after Docker recreates a manager container.
resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s

frontend cluster
    bind :8080
    default_backend active_manager

backend active_manager
    option httpchk GET /api/ready
    http-check expect status 200
    default-server inter 1s fall 1 rise 1 init-state fully-down resolvers docker init-addr libc,none
    server manager_a manager-a:8080 check
    server manager_b manager-b:8080 check
