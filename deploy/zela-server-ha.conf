# Install as /etc/systemd/system/zela-server.service.d/ha.conf on each manager.
# Use deploy/zela-server.service plus shared credentials and unique
# ZELA_MANAGER_ID in /etc/zela/zela-server.env.
[Service]
ExecStart=
ExecStart=/usr/local/bin/zela-server --ha --listen 0.0.0.0:8080 --data /var/lib/zela --worker-binaries /opt/zela/workers --tls-cert /etc/zela/control.crt --tls-key /etc/zela/control.key
